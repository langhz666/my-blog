<div class="comments-container" style="margin-top: 2rem; padding: 1.5rem; background: var(--card-bg, #fff); border: 1px solid var(--border); border-radius: 12px;">
    <h3 style="margin-bottom: 1rem;">✍️ 留言与评论</h3>
    
    {{- if and site.Params.giscus.repo site.Params.giscus.repoId }}
    <script src="https://giscus.app/client.js"
        data-repo="{{ site.Params.giscus.repo }}"
        data-repo-id="{{ site.Params.giscus.repoId }}"
        data-category="{{ site.Params.giscus.category | default "Announcements" }}"
        data-category-id="{{ site.Params.giscus.categoryId }}"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
    </script>
    {{- else }}
    <div style="text-align: center; color: var(--text-muted, #666); padding: 2rem 0;">
        <p><strong>Giscus 评论还未完全配置</strong></p>
        <p style="font-size: 0.9rem; margin-top: 0.5rem; line-height: 1.6;">
            请前往 <a href="https://giscus.app/zh-CN" target="_blank" style="color: var(--primary);">giscus.app</a> 绑定您的 GitHub 仓库。<br>
            然后在 <code>hugo.toml</code> 中填写 <code>repo</code>, <code>repoId</code> 和 <code>categoryId</code>。
        </p>
    </div>
    {{- end }}
</div>

<style>
    /* 适配深色模式 */
    [data-theme="dark"] .comments-container {
        background: var(--entry, #1e293b);
    }
</style>
