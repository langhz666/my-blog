{{- /* 阅读进度条样式 */ -}}
<style>
.reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0%;
    height: 3px;
    background: var(--gradient-primary);
    z-index: 9999;
    transition: width 0.1s linear;
    box-shadow: 0 0 8px rgba(102, 126, 234, 0.5);
}

/* 页面加载动画 */
.page-enter {
    animation: pageEnter 0.5s ease-out;
}

@keyframes pageEnter {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Profile 打字光标 */
.typing-cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent-color);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

/* 浮动粒子容器 */
#particles-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
}

[data-theme="dark"] #particles-canvas {
    opacity: 0.25;
}

/* 文章内动画 */
.post-content h2,
.post-content h3,
.post-content p,
.post-content ul,
.post-content blockquote,
.post-content pre {
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 0.5s ease, transform 0.5s ease;
}

.post-content h2.visible,
.post-content h3.visible,
.post-content p.visible,
.post-content ul.visible,
.post-content blockquote.visible,
.post-content pre.visible {
    opacity: 1;
    transform: translateY(0);
}

/* 文章反应按钮 */
.post-reactions {
    display: flex;
    gap: 12px;
    justify-content: center;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    margin-top: 32px;
}

.post-reactions .reaction-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: transparent;
    cursor: pointer;
    font-size: 14px;
    color: var(--secondary);
    transition: all 0.25s ease;
    user-select: none;
}

.post-reactions .reaction-btn:hover {
    border-color: var(--accent-color);
    color: var(--accent-color);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
}

.post-reactions .reaction-btn.active {
    background: var(--gradient-subtle);
    border-color: var(--accent-color);
    color: var(--accent-color);
    font-weight: 600;
}

.post-reactions .reaction-btn .emoji {
    font-size: 18px;
    transition: transform 0.25s ease;
}

.post-reactions .reaction-btn:hover .emoji {
    transform: scale(1.3);
}

.post-reactions .reaction-btn .count {
    min-width: 16px;
    text-align: center;
}

/* 文章底部分享区域增强 */
.post-share {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
}

/* 标签云动画 */
.terms-tags li {
    display: inline-block;
    transition: transform 0.2s ease;
}

.terms-tags li:hover {
    transform: scale(1.08);
}

/* 归档页时间线 */
.archive-entry {
    position: relative;
    padding-left: 24px;
    border-left: 2px solid var(--border);
    margin-left: 8px;
    padding-bottom: 16px;
    transition: border-color 0.3s ease;
}

.archive-entry:hover {
    border-left-color: var(--accent-color);
}

.archive-entry::before {
    content: '';
    position: absolute;
    left: -5px;
    top: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-color);
    transition: transform 0.2s ease;
}

.archive-entry:hover::before {
    transform: scale(1.4);
}

/* 文章元信息美化 */
.post-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
}

.post-meta .meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    color: var(--secondary);
}

/* 搜索结果高亮 */
.search-mark {
    background: rgba(102, 126, 234, 0.15);
    padding: 1px 4px;
    border-radius: 3px;
}

/* 浮动操作按钮组 */
.fab-container {
    position: fixed;
    bottom: 80px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.3s ease, transform 0.3s ease;
}

.fab-container.visible {
    opacity: 1;
    transform: translateY(0);
}

.fab-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--entry);
    color: var(--secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.25s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.fab-btn:hover {
    background: var(--gradient-primary);
    color: #fff;
    border-color: transparent;
    transform: scale(1.1);
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
}

[data-theme="dark"] .fab-btn {
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

/* 文章内图片悬浮效果 */
.post-content img {
    border-radius: 8px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: zoom-in;
}

.post-content img:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
}

/* 代码块语言标签 */
div.highlight {
    position: relative;
}

div.highlight::before {
    content: attr(data-lang);
    position: absolute;
    top: 0;
    right: 0;
    padding: 2px 10px;
    font-size: 11px;
    color: var(--secondary);
    background: var(--code-bg);
    border-radius: 0 12px 0 8px;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    z-index: 1;
}

/* 引用块美化 */
.post-content blockquote {
    border-left: 3px solid var(--accent-color);
    background: var(--gradient-subtle);
    border-radius: 0 8px 8px 0;
    padding: 12px 16px;
    margin: 16px 0;
}

/* 表格美化 */
.post-content table {
    border-radius: 8px;
    overflow: hidden;
}

.post-content table th {
    background: var(--gradient-subtle);
}

/* 平滑滚动 */
html {
    scroll-behavior: smooth;
}

/* 移动端适配 */
@media (max-width: 768px) {
    .fab-container {
        bottom: 70px;
        right: 16px;
    }
    .fab-btn {
        width: 36px;
        height: 36px;
        font-size: 16px;
    }
    .post-reactions {
        gap: 8px;
    }
    .post-reactions .reaction-btn {
        padding: 6px 12px;
        font-size: 13px;
    }
}
</style>
