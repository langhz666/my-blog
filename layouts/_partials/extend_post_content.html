{{- /* 文章底部反应按钮 */ -}}
<div class="post-reactions" id="postReactions">
    <button class="reaction-btn" data-type="like" onclick="toggleReaction(this)">
        <span class="emoji">👍</span>
        <span class="count">0</span>
    </button>
    <button class="reaction-btn" data-type="love" onclick="toggleReaction(this)">
        <span class="emoji">❤️</span>
        <span class="count">0</span>
    </button>
    <button class="reaction-btn" data-type="insightful" onclick="toggleReaction(this)">
        <span class="emoji">💡</span>
        <span class="count">0</span>
    </button>
    <button class="reaction-btn" data-type="bookmark" onclick="toggleReaction(this)">
        <span class="emoji">🔖</span>
        <span class="count">0</span>
    </button>
</div>
